name: Build Android Debug APK

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is named master
  workflow_dispatch:     # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v7  # Upgraded to fix Node deprecation

    - name: Set up JDK 17
      uses: actions/setup-java@v6 # Upgraded to fix Node deprecation
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
